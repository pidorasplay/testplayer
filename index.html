<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HLS Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #app {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        #player-container {
            flex: 3;
        }

        video {
            width: 100%;
        }

        #episode-list {
            flex: 1;
        }

        #episodes {
            list-style: none;
            padding: 0;
        }

        #episodes li {
            padding: 10px;
            cursor: pointer;
            background: #222;
            margin-bottom: 5px;
        }
        
        #episodes li:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div id="app">
    <div id="controls">
        <select id="anime-selector">
            <option value="">Выберите аниме</option>
        </select>
    </div>
    <div id="player-container">
        <video id="video" controls></video>
    </div>
    <div id="episode-list">
        <h3>Серии:</h3>
        <ul id="episodes"></ul>
    </div>
</div>

<script>
const video = document.getElementById('video');

// Сохранение позиции каждые 5 секунд
setInterval(() => {
    if (!video.paused && !video.ended && currentAnime) {
        localStorage.setItem(`progress_${currentAnime.anime_id}_${currentEpisode}`, video.currentTime);
    }
}, 5000);

// Сохранение при паузе
video.addEventListener('pause', () => {
    if (!video.ended && currentAnime) {
        localStorage.setItem(`progress_${currentAnime.anime_id}_${currentEpisode}`, video.currentTime);
    }
});
</script>

</body>
</html>
